name: Build webOS IPK

on:
  push:
    branches: ['*']
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  NDK_URL: https://github.com/webosbrew/meta-lg-webos-ndk/releases/download/1.0.g-rev.4/webos-sdk-x86_64-armv7a-neon-toolchain-1.0.g.sh
  NDK_DIR: /opt/webos-sdk-x86_64/1.0.g

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1.2 GB; cache it so the rebuild is ~30 s instead of minutes
      - name: Install webOS CLI (ares-package)
        run: npm install -g @webos-tools/cli

      - name: Cache webOS NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          key: ndk-1.0.g-rev.4

      - name: Download webOS NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/ndk"
          curl -fsSL "$NDK_URL" -o "${{ runner.temp }}/ndk/ndk.sh"
          chmod 755 "${{ runner.temp }}/ndk/ndk.sh"

      - name: Install webOS NDK
        run: |
          if [ ! -d "$NDK_DIR" ]; then sudo "${{ runner.temp }}/ndk/ndk.sh" -y; fi
          ls "$NDK_DIR"

      - name: Configure
        shell: bash
        # The NDK's own cmake predates -S/-B, so use the positional form (source, then build dir)
        working-directory: ${{ github.workspace }}
        run: |
          . "$NDK_DIR/environment-setup-armv7a-neon-webos-linux-gnueabi"
          mkdir -p build && cd build
          cmake "$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DWEBOS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/sysroots/x86_64-webossdk-linux/usr/share/cmake/OEToolchainConfig.cmake"

      - name: Build game
        shell: bash
        run: |
          . "$NDK_DIR/environment-setup-armv7a-neon-webos-linux-gnueabi"
          cmake --build build --config "$BUILD_TYPE" --target SpaceCadetPinball -- -j"$(nproc)"

      - name: Package IPK
        shell: bash
        run: |
          . "$NDK_DIR/environment-setup-armv7a-neon-webos-linux-gnueabi"
          cmake --build build --config "$BUILD_TYPE" --target webos-package -- -j"$(nproc)"

      # Real smoke test: an IPK that is empty, unreadable or missing the binary is a broken
      # release, and that is checkable without a TV.
      - name: Verify IPK contents
        shell: bash
        run: |
          set -e
          ipk=$(find build -name '*.ipk' | head -1)
          [ -n "$ipk" ] || { echo "no IPK produced"; exit 1; }
          echo "IPK: $ipk ($(stat -c%s "$ipk") bytes)"
          rm -rf /tmp/ipk && mkdir -p /tmp/ipk
          ar x "$ipk" --output=/tmp/ipk 2>/dev/null || (cd /tmp/ipk && ar x "$OLDPWD/$ipk")
          data=$(find /tmp/ipk -name 'data.tar.*' | head -1)
          [ -n "$data" ] || { echo "IPK has no data archive"; exit 1; }
          tar tf "$data" > /tmp/ipk/list.txt
          for need in appinfo.json SpaceCadetPinball; do
            grep -q "/$need\$" /tmp/ipk/list.txt || { echo "missing: $need"; cat /tmp/ipk/list.txt; exit 1; }
          done
          echo "IPK contains appinfo.json and the game binary"
          file build/SpaceCadetPinball/SpaceCadetPinball 2>/dev/null | head -1 || true

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-ipk
          path: |
            build/**/*.ipk
            build/**/webosbrew.manifest.json
          if-no-files-found: error
